server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: uninotes-india
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/uninotes}
      database: uninotes
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 250MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:UniNotesDefaultChangeMeDontUseInProd}
  security:
    bcrypt-strength: ${APP_BCRYPT_STRENGTH:10}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
